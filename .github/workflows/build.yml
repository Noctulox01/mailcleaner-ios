name: Build IPA

# Construit un .ipa NON SIGNÉ sur un Mac GitHub à chaque push (ou via « Run workflow »).
# En cas d'échec, chaque erreur du compilateur est publiée en annotation (lisible dans l'onglet Actions).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        run: xcodegen generate

      - name: Compiler (archive non signee)
        run: |
          xcodebuild \
            -project MailCleaner.xcodeproj \
            -scheme MailCleaner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/MailCleaner.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" build.log | sort -u | head -80 || true
          if ! grep -q "ARCHIVE SUCCEEDED" build.log; then
            grep -E "^/.*:[0-9]+:[0-9]+: error: " build.log | sort -u | head -40 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s#^$PWD/##")
              ln=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | sed -E 's#^[^:]+:[0-9]+:[0-9]+: error: ##')
              echo "::error file=$file,line=$ln::$msg"
            done
            tail -30 build.log
            exit 1
          fi

      - name: Emballer en .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/MailCleaner.xcarchive/Products/Applications/MailCleaner.app out/Payload/
          cd out && zip -qr MailCleaner-unsigned.ipa Payload && rm -rf Payload && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: MailCleaner-ipa
          path: out/MailCleaner-unsigned.ipa
          if-no-files-found: error
