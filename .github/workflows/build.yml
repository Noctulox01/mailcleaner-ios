name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre project.yml avec le code
        run: cp project.yml ios-app/project.yml

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer le projet Xcode
        working-directory: ios-app
        run: xcodegen generate

      - name: Compiler (archive non signee)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project MailCleaner.xcodeproj \
            -scheme MailCleaner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/MailCleaner.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Emballer en .ipa
        working-directory: ios-app
        run: |
          mkdir -p out/Payload
          cp -R build/MailCleaner.xcarchive/Products/Applications/MailCleaner.app out/Payload/
          cd out && zip -qr MailCleaner-unsigned.ipa Payload && rm -rf Payload && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: MailCleaner-ipa
          path: ios-app/out/MailCleaner-unsigned.ipa
          if-no-files-found: error
