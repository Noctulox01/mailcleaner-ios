name: MailCleaner
options:
  bundleIdPrefix: fr.mailcleaner
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  MailCleaner:
    type: application
    platform: iOS
    scheme: {}   # schéma partagé, indispensable pour `xcodebuild -scheme` en CI
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: MailCleaner
        PRODUCT_BUNDLE_IDENTIFIER: fr.mailcleaner.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
